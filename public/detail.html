<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로트 상세 — COE ARCHIVE</title>

  <script>
    try {
      const savedTheme = localStorage.getItem('coe-theme');
      const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = savedTheme || systemTheme;
    } catch {
      document.documentElement.dataset.theme = 'light';
    }
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/page.css">
</head>
<body data-auth="unknown">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="site-header__inner container">
      <a class="brand" href="/index.html">COE <span class="brand__mark">ARCHIVE</span></a>

      <nav aria-label="주요 메뉴">
        <ul class="nav" role="list">
          <li><a class="nav__link" href="/beans.html">아카이브</a></li>
          <li><a class="nav__link" href="/stats.html">통계</a></li>
          <li><a class="nav__link" href="/guide.html">가공방식</a></li>
          <li><a class="nav__link" href="/brew.html">추출 계산기</a></li>
          <li class="auth-only"><a class="nav__link" href="/notes.html">내 노트</a></li>
          <li class="guest-only"><a class="nav__link" href="/login.html">로그인</a></li>
          <li class="auth-only"><span class="nav__user" data-user-name></span></li>
          <li class="auth-only"><button class="btn btn--sm btn--ghost" type="button" data-logout>로그아웃</button></li>
        </ul>
      </nav>

      <button class="icon-btn" type="button" data-theme-toggle aria-label="다크 모드로 전환">☾</button>
    </div>
  </header>

  <main id="main" class="page container">
    <p class="detail__back"><a href="/beans.html">← 아카이브로</a></p>

    <!-- 로트 전체 정보가 여기에 그려진다. 실패하면 이 자리에 안내가 들어간다. -->
    <div data-detail>
      <div class="skeleton" aria-hidden="true" style="height: 16rem"></div>
    </div>

    <!-- 유사 로트 3건 -->
    <section class="section" aria-labelledby="similar-title">
      <div class="section__head">
        <h2 id="similar-title" class="serif">Similar profiles</h2>
        <p class="muted">감각 6축 거리가 가까운 순</p>
      </div>
      <div class="grid" data-similar></div>
    </section>

    <!-- 이 로트에 달린 테이스팅 노트. 비로그인도 볼 수 있다. -->
    <section class="section" id="notes-section" aria-labelledby="bean-notes-title">
      <div class="section__head notes-head">
        <h2 id="bean-notes-title" class="serif">Tasting notes</h2>
        <p class="muted" data-notes-summary aria-live="polite"></p>
      </div>

      <div data-bean-notes></div>
      <nav class="pagination" data-notes-pagination aria-label="노트 페이지 이동"></nav>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="disclaimer">
        감각 6축과 향미 키워드는 ACE 공식 공개 항목이 아니며, 가공방식·품종·총점을 근거로 산출한 추정치입니다.
      </p>
      <p>출처 Alliance for Coffee Excellence (ACE) 공식 경쟁·경매 결과 · COE 2025 브라질·과테말라 74건</p>
    </div>
  </footer>

  <script type="module" src="/js/detail.js"></script>
</body>
</html>
